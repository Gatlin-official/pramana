# Retrieval grid: every combination below is run over the full question set (cheap: no LLM).
retrieval:
  k: 10
  chunk_size: [256, 512, 1024]
  overlap: [0, 15]            # percent
  mode: [dense, keyword, hybrid]
  rerank: [false, true]       # cross-encoder over the top 30
  extra_configs: [heading-512]  # heading-aware chunker, same modes x rerank

# Generation (answer + citations + judge) is ~100x slower than retrieval, so it runs on 3 runs at the
# chunk config with the best retrieval recall@5: the dense baseline, hybrid, and hybrid + rerank.
generation:
  k: 5
  chunk_config: best
  runs:
    - {mode: dense, rerank: false}
    - {mode: hybrid, rerank: false}
    - {mode: hybrid, rerank: true}
