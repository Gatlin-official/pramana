name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: pramana, POSTGRES_PASSWORD: pramana, POSTGRES_DB: pramana}
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U pramana" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - name: lint
        working-directory: backend
        run: ruff check . ../eval && ruff format --check . ../eval
      - name: migrate
        working-directory: backend
        run: alembic upgrade head
      - name: tests (includes smoke eval with stubbed LLM)
        working-directory: backend
        run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
